*{box-sizing:border-box}
body{background:var(--plane);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1200px;margin:0 auto}
a{color:var(--accent)}

/* header band */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 28px;margin-top:16px;padding:22px 26px;border-radius:16px;color:#fff;
  background:radial-gradient(120% 160% at 100% 0%,var(--hero2) 0%,transparent 60%),linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:var(--shadow)}
.eyebrow{font-size:12.5px;letter-spacing:.04em;color:rgba(255,255,255,.72);margin:0 0 4px}
h1{font-size:23px;line-height:1.3;margin:0;font-weight:600;text-wrap:balance;color:#fff}
.top p{margin:6px 0 0;color:rgba(255,255,255,.84);max-width:62ch;font-size:13.5px}
.sim{background:var(--sim-bg);color:var(--sim-ink);border:1px solid var(--sim-line);border-radius:10px;padding:8px 12px;font-size:12.5px;max-width:44ch;line-height:1.5}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-top:12px;background:color-mix(in srgb,var(--plane) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--border);border-radius:11px;background:var(--surface)}
.seg button{font:inherit;border:0;background:transparent;color:var(--ink2);padding:7px 16px;cursor:pointer;border-radius:8px;font-weight:500}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 1px 3px rgba(15,27,45,.25)}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--ink2)}
label.f{display:flex;align-items:center;gap:8px;font-weight:500}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;max-width:100%}
select:hover,input[type=search]:hover{border-color:var(--axis)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* drill path + report picker */
.crumb{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;margin-top:12px;padding:6px 12px;color:var(--ink2);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.crumb button{font:inherit;border:0;background:none;color:var(--accent);cursor:pointer;padding:3px 7px;border-radius:6px;font-weight:500}
.crumb button:hover{background:var(--tint)}
.crumb b{color:var(--ink);font-weight:600;padding:3px 7px;background:var(--tint);border-radius:6px}
.crumb .sep,.crumb .hint{color:var(--muted)}
.crumb .hint:first-child{font-weight:500;margin-right:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px;scrollbar-width:thin}
.chips button{flex:none;font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 1px rgba(15,27,45,.04)}
.chips button:hover{border-color:var(--accent);color:var(--ink)}
.chips button b{font-family:var(--mono);font-weight:600;margin-right:7px;color:var(--accent)}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}

/* report panel */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;min-width:0;box-shadow:var(--shadow)}
.ph{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.code{font-family:var(--mono);font-size:12.5px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 9px}
h2{font-size:20px;line-height:1.35;margin:0;font-weight:600}
.q{color:var(--ink2);margin:4px 0 8px;max-width:78ch;font-size:14.5px}
.fx{font-family:var(--mono);font-size:12px;color:var(--ink2);margin:0 0 18px;overflow-wrap:anywhere;background:var(--raise);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;padding:7px 12px}
h3{font-size:14.5px;margin:26px 0 10px;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
h3::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--accent);flex:none}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:8px}
.tile{position:relative;overflow:hidden;background:var(--raise);border:1px solid var(--border);border-radius:12px;padding:15px 15px 13px;min-width:0}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent)}
.tile .l{color:var(--ink2);font-size:12.5px;font-weight:500}
.tile .v{font-size:28px;font-weight:600;line-height:1.2;margin:3px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .v small{font-size:13px;font-weight:400;color:var(--ink2);margin-left:5px;letter-spacing:0}
.tile .s{font-size:12px;color:var(--muted)}
.dl{font-weight:600;font-variant-numeric:tabular-nums}
.dl.g{color:var(--good-text)} .dl.b{color:var(--crit-text)} .dl.n{color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px}
.grid2>*{min-width:0}

/* charts */
.chart{width:100%;min-width:0}
.svg{display:block;max-width:100%;overflow:visible}
.svg text{font-family:var(--font);font-size:12px;fill:var(--muted)}
.svg .tl{fill:var(--ink2);dominant-baseline:middle}
.svg .tv{fill:var(--ink);font-weight:500;dominant-baseline:middle;font-variant-numeric:tabular-nums}
.svg .band .xh{opacity:0} .svg .band:hover .xh{opacity:1}
.svg .band .mk{opacity:0} .svg .band:hover .mk{opacity:1}

.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:10px 0 0;color:var(--ink2);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend i.ln{height:0;border-top:2px solid;border-radius:0;width:16px}
.legend i.dash{border-top-style:dashed}

.scroll{overflow-x:auto;max-width:100%;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}

tr.tot td{font-weight:600;background:var(--raise)!important;border-top:1px solid var(--axis)}
.mono{font-family:var(--mono);font-size:12px}
td.cell{border-bottom-color:var(--surface)}
.inl{display:inline-block;height:8px;border-radius:4px;background:var(--s1);vertical-align:middle;margin-left:8px}
.spk{display:block}

.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:0 10px;font-size:12px;line-height:22px;color:var(--ink);white-space:nowrap;background:var(--raise)}
.pill b{font-size:11px;line-height:1}
.pill.ok{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,var(--surface))}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,var(--surface));border-color:color-mix(in srgb,var(--warn) 55%,var(--surface))}
.pill.sr{background:color-mix(in srgb,var(--serious) 18%,var(--surface));border-color:color-mix(in srgb,var(--serious) 50%,var(--surface))}
.pill.crit{background:color-mix(in srgb,var(--crit) 14%,var(--surface));border-color:color-mix(in srgb,var(--crit) 42%,var(--surface))}
.pill.info{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:color-mix(in srgb,var(--accent) 38%,var(--surface))}

details.dt summary{cursor:pointer;width:max-content;padding:2px 0}

.tt b{display:block;margin-bottom:4px}
.tt div{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tt div i{width:9px;height:9px;border-radius:2px;flex:none}
.tt div span{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:12.5px;margin-top:24px;text-align:center}
@media (max-width:560px){.top{padding:18px}.panel{padding:16px}h1{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>

  var m={};D.item.forEach(function(r){if(!c.set[r[0]])return;var o=m[r[1]]||(m[r[1]]={n:0,q:0});o.n+=r[2];o.q+=r[3];});
  return Object.keys(m).sort(function(a,b){return m[b].n-m[a].n;}).map(function(k){return {code:D.items[k][0],name:D.items[k][1],n:m[k].n,q:m[k].q};});
}

var REPS=[];function rep(id,role,title,q,fx,fn){REPS.push({id:id,role:role,title:title,q:q,fx:fx,fn:fn});}

function hospPage(c){
  var h=HS[state.hosp],a=agg(c);

   '<div class="grid2"><div><h3>รายการเบิกรายเดือน</h3>'+trendChart(c)+'</div><div><h3>สถานะของรายการเบิก</h3>'+statusBars(a)+'</div></div>'+
   '<h3>ยอดเบิกและยอดชดเชยรายเดือน (ล้านบาท)</h3>'+claimTrend(c)+
   '<h3>กองทุนย่อย (สูงสุด 8 รายการ)</h3>'+fT.html+
   '<h3>รายการเบิกที่ใช้มากที่สุด 10 อันดับ <span style="font-weight:400;color:var(--muted)">(ทุกเดือน)</span></h3><div class="scroll"><table><thead><tr><th class="l">รหัส</th><th class="l">รายการ</th><th>จำนวนรายการ</th></tr></thead><tbody>'+it.map(function(r){return '<tr><td class="l mono">'+esc(r.code)+'</td><td class="l" style="white-space:normal">'+esc(r.name)+'</td><td>'+nf(r.n)+'</td></tr>';}).join('')+'</tbody></table></div>'+
   '<h3>รายการเบิกล่าสุด (E2E) '+recent.length+' รายการ</h3>'+e2eTable(recent)+
   partialNote(c);

function e2eTable(list){
  if(!list.length)return '<p class="note">ไม่พบรายการล่าสุดของหน่วยบริการนี้</p>';
  return '<div class="scroll"><table><thead><tr><th class="l">เลข E2E</th><th>วันที่ส่งเบิก</th><th>วันที่รับบริการ</th><th class="l">สถานะ</th><th>ยอดเบิก (บาท)</th><th>ยอดชดเชย (บาท)</th></tr></thead><tbody>'+
   list.map(function(r){var s=ST[r[3]];return '<tr><td class="l mono">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2]||'-')+'</td><td class="l">'+(s?s.code+' '+esc(stShort(s)):'-')+'</td><td>'+nf(r[4])+'</td><td>'+nf(r[5])+'</td></tr>';}).join('')+'</tbody></table></div>';
}

/* ---------- shell ---------- */
function render(){
  document.querySelectorAll('#roles button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.role===state.role));});
  var list=REPS.filter(function(r){return r.role===state.role;});
  if(!list.some(function(r){return r.id===state.rep;}))state.rep=list[0].id;
  document.getElementById('chips').innerHTML=list.map(function(r){return '<button data-rep="'+r.id+'" aria-pressed="'+(r.id===state.rep)+'"><b>'+r.id+'</b>'+r.title+'</button>';}).join('');
  document.getElementById('crumb').innerHTML=crumbHtml();
  var r=REPS.filter(function(x){return x.id===state.rep;})[0],c=ctx();charts=[];
  var body=r.fn(c),panel=document.getElementById('panel');
  panel.innerHTML='<div class="ph"><span class="code">'+r.id+'</span><h2>'+r.title+'</h2></div><p class="q">'+r.q+'</p><p class="fx">'+r.fx+'</p>'+body;
  drawCharts();lastW=panel.clientWidth;
}
function drawCharts(){document.querySelectorAll('#panel [data-c]').forEach(function(el){var ch=charts[+el.dataset.c];if(ch)ch.fn(el);});}
var tt=document.getElementById('tt');
document.addEventListener('pointermove',function(e){
  var t=e.target.closest&&e.target.closest('[data-tip]'),v=t&&t.getAttribute('data-tip');
  if(!v){tt.style.display='none';return;}
  tt.innerHTML=v;tt.style.display='block';
  var w=tt.offsetWidth,h=tt.offsetHeight,x=e.clientX+14,y=e.clientY+14;
  if(x+w>window.innerWidth-8)x=e.clientX-w-14;if(y+h>window.innerHeight-8)y=e.clientY-h-14;
  tt.style.left=Math.max(4,x)+'px';tt.style.top=Math.max(4,y)+'px';});
document.getElementById('roles').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.role=b.dataset.role;render();});
document.getElementById('chips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.rep=b.dataset.rep;render();});
document.getElementById('fprov').addEventListener('change',function(e){setDrill(e.target.value==='all'?'all':'p:'+e.target.value);});
document.getElementById('ffy').addEventListener('change',function(e){state.fy=+e.target.value;render();});
document.addEventListener('click',function(e){var d=e.target.closest&&e.target.closest('[data-dd]');if(d){e.preventDefault();setDrill(d.getAttribute('data-dd'));}});
document.getElementById('panel').addEventListener('change',function(e){var k=e.target.dataset&&e.target.dataset.k;if(!k)return;state.local[k]=e.target.value;render();});
document.getElementById('panel').addEventListener('input',function(e){var k=e.target.dataset&&e.target.dataset.k;if(k!=='o1q')return;state.local[k]=e.target.value;var pos=e.target.selectionStart;render();var inp=document.querySelector('[data-k="o1q"]');if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch(x){}}});
var rz=0;new ResizeObserver(function(){cancelAnimationFrame(rz);rz=requestAnimationFrame(function(){var w=document.getElementById('panel').clientWidth;if(Math.abs(w-lastW)>6){lastW=w;drawCharts();}});}).observe(document.getElementById('panel'));
document.getElementById('fprov').innerHTML='<option value="all">ทั้งเขต 3</option>'+PROVS.map(function(p){return '<option value="'+p.c+'">'+p.n+'</option>';}).join('');
document.getElementById('ffy').innerHTML=FYS.map(function(f){return '<option value="'+f+'"'+(f===state.fy?' selected':'')+'>'+fyLabel(f)+'</option>';}).join('');
var lastT=D.meta.tables[0]?String(D.meta.tables[0].latest).slice(0,10):'';
document.getElementById('sub').textContent='รายงานจากข้อมูลจริงของระบบ ตั้งแต่เริ่มระบบ 1 พฤษภาคม 2569 สะสมตามปีงบประมาณ';
document.getElementById('asof').innerHTML='<b>ข้อมูลล่าสุด</b> วันที่ส่งเบิกล่าสุด '+lastT+' · สร้างรายงานเมื่อ '+D.meta.built+' · การจัดกลุ่มสถานะเป็นข้อเสนอ รอยืนยัน';
document.getElementById('foot').textContent='รายงานนี้ไม่แสดงข้อมูลส่วนบุคคลของผู้รับบริการ · ข้อมูลปรับปรุงเป็นรายสัปดาห์';
render();
